update-manifests:
  stage: update-manifests
  image: "nexuss.mahbod.com:8082/base/alpine-curl-jq:3.20.3"
  needs:
    - adservice-push
    - cartservice-push
    - checkoutservice-push
    - currencyservice-push
    - emailservice-push
    - frontend-push
    - loadgenerator-push
    - paymentservice-push
    - productcatalogservice-push
    - recommendationservice-push
    - shippingservice-push
    - shoppingassistantservice-push
  script:
    
    - mkdir -p actions
    - |
      for service in adservice cartservice checkoutservice currencyservice emailservice frontend loadgenerator paymentservice productcatalogservice recommendationservice shippingservice shoppingassistantservice
      do
        FILE_PATH="k8s/services/${service}/deployment.yaml"
        ENCODED_FILE_PATH=$(printf '%s' "$FILE_PATH" | sed 's|/|%2F|g')

        curl --fail --silent --show-error \
          --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          "http://gitlab.mahbod.com:8080/api/v4/projects/mahbod1%2Fmicroservices-demo/repository/files/${ENCODED_FILE_PATH}?ref=main" \
          -o response.json

        jq -r '.content' response.json | base64 -d > deployment.yaml

        sed -E -i "s|(image:[[:space:]]*nexuss\.mahbod\.com:8082/online-boutique/${service}:)[^[:space:]]+|\1${CI_COMMIT_SHA}|" deployment.yaml

        CONTENT=$(cat deployment.yaml)

        jq -n \
          --arg file_path "$FILE_PATH" \
          --arg content "$CONTENT" \
          '{
            action: "update",
            file_path: $file_path,
            content: $content
          }' > "actions/${service}.json"
      done
    - |
      ACTIONS=$(jq -s '.' actions/*.json)

      jq -n \
        --arg branch "main" \
        --arg commit_message "ci: update all service images to ${CI_COMMIT_SHA}" \
        --argjson actions "$ACTIONS" \
        '{
          branch: $branch,
          commit_message: $commit_message,
          actions: $actions
        }' > commit.json
    - |
      curl --fail --silent --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data-binary @commit.json \
        "http://gitlab.mahbod.com:8080/api/v4/projects/mahbod1%2Fmicroservices-demo/repository/commits"