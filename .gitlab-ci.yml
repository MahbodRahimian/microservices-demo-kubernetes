stages:
  - build
  - push
  - update-manifests

variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"

adservice-build:
  stage: build
  image: "docker:27-cli"
  variables:
    SERVICE_NAME: "adservice"
  script:
    - docker version
    - docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" -p "$NEXUS_PASSWORD"
    - docker build --add-host=nexuss.mahbod.com:192.168.168.144 --build-arg HTTP_PROXY="$HTTP_PROXY" --build-arg HTTPS_PROXY="$HTTPS_PROXY" --build-arg NO_PROXY="$NO_PROXY" --build-arg GOPROXY="$GOPROXY" -t "$NEXUS_REGISTRY/online-boutique/$SERVICE_NAME:$CI_COMMIT_SHA" "src/$SERVICE_NAME"

