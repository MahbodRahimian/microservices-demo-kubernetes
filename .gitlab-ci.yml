stages:
  - build
  - push
  - update-manifests


variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"

  NEXUS_REGISTRY: "nexuss.mahbod.com:8082"

  GITLAB_API_URL: "http://gitlab.mahbod.com:8080/api/v4"

  IMAGE_NAMESPACE: "online-boutique"


# ============================================================
# Service Matrix
# ============================================================

.service_matrix: &service_matrix
  parallel:
    matrix:
      - SERVICE_NAME: "adservice"
        BUILD_CONTEXT: "src/adservice"
        CHANGES_PATH: "src/adservice"

      - SERVICE_NAME: "cartservice"
        BUILD_CONTEXT: "src/cartservice/src"
        CHANGES_PATH: "src/cartservice"

      - SERVICE_NAME: "checkoutservice"
        BUILD_CONTEXT: "src/checkoutservice"
        CHANGES_PATH: "src/checkoutservice"

      - SERVICE_NAME: "currencyservice"
        BUILD_CONTEXT: "src/currencyservice"
        CHANGES_PATH: "src/currencyservice"

      - SERVICE_NAME: "emailservice"
        BUILD_CONTEXT: "src/emailservice"
        CHANGES_PATH: "src/emailservice"

      - SERVICE_NAME: "frontend"
        BUILD_CONTEXT: "src/frontend"
        CHANGES_PATH: "src/frontend"

      - SERVICE_NAME: "loadgenerator"
        BUILD_CONTEXT: "src/loadgenerator"
        CHANGES_PATH: "src/loadgenerator"

      - SERVICE_NAME: "paymentservice"
        BUILD_CONTEXT: "src/paymentservice"
        CHANGES_PATH: "src/paymentservice"

      - SERVICE_NAME: "productcatalogservice"
        BUILD_CONTEXT: "src/productcatalogservice"
        CHANGES_PATH: "src/productcatalogservice"

      - SERVICE_NAME: "recommendationservice"
        BUILD_CONTEXT: "src/recommendationservice"
        CHANGES_PATH: "src/recommendationservice"

      - SERVICE_NAME: "shippingservice"
        BUILD_CONTEXT: "src/shippingservice"
        CHANGES_PATH: "src/shippingservice"

      - SERVICE_NAME: "shoppingassistantservice"
        BUILD_CONTEXT: "src/shoppingassistantservice"
        CHANGES_PATH: "src/shoppingassistantservice"


# ============================================================
# Build
# ============================================================

build-services:
  stage: build

  image: "nexuss.mahbod.com:8082/base/docker:27-cli"

  <<: *service_matrix

  rules:
    - changes:
        - "$CHANGES_PATH/**/*"
    - when: never

  script:
    - |
      set -e

      echo "=========================================="
      echo "Building service: ${SERVICE_NAME}"
      echo "Build context:     ${BUILD_CONTEXT}"
      echo "Commit SHA:        ${CI_COMMIT_SHA}"
      echo "=========================================="

    - docker version

    - |
      echo "${NEXUS_PASSWORD}" | docker login \
        "${NEXUS_REGISTRY}" \
        --username "${NEXUS_USERNAME}" \
        --password-stdin

    - |
      docker build \
        --add-host=nexuss.mahbod.com:192.168.168.144 \
        --build-arg HTTP_PROXY="${HTTP_PROXY}" \
        --build-arg HTTPS_PROXY="${HTTPS_PROXY}" \
        --build-arg NO_PROXY="${NO_PROXY}" \
        --build-arg GOPROXY="${GOPROXY}" \
        -t "${NEXUS_REGISTRY}/${IMAGE_NAMESPACE}/${SERVICE_NAME}:${CI_COMMIT_SHA}" \
        "${BUILD_CONTEXT}"


# ============================================================
# Push
# ============================================================

push-services:
  stage: push

  image: "nexuss.mahbod.com:8082/base/docker:27-cli"

  <<: *service_matrix

  needs:
    - job: build-services
      parallel:
        matrix:
          - SERVICE_NAME: ['$[[ matrix.SERVICE_NAME ]]']
            BUILD_CONTEXT: ['$[[ matrix.BUILD_CONTEXT ]]']
            CHANGES_PATH: ['$[[ matrix.CHANGES_PATH ]]']

  rules:
    - changes:
        - "$CHANGES_PATH/**/*"
    - when: never

  script:
    - |
      set -e

      echo "=========================================="
      echo "Pushing service: ${SERVICE_NAME}"
      echo "Image tag:       ${CI_COMMIT_SHA}"
      echo "=========================================="

    - |
      echo "${NEXUS_PASSWORD}" | docker login \
        "${NEXUS_REGISTRY}" \
        --username "${NEXUS_USERNAME}" \
        --password-stdin

    - |
      docker push \
        "${NEXUS_REGISTRY}/${IMAGE_NAMESPACE}/${SERVICE_NAME}:${CI_COMMIT_SHA}"


# ============================================================
# Update Kubernetes Manifests
# ============================================================

update-manifests:
  stage: update-manifests

  image: "nexuss.mahbod.com:8082/base/alpine-curl-jq:3.20.3"

  rules:
    - changes:
        - "src/**/*"
    - when: never

  script:
    - |
      set -e

      echo "=========================================="
      echo "Detecting changed services"
      echo "Commit:     ${CI_COMMIT_SHA}"
      echo "Project ID: ${CI_PROJECT_ID}"
      echo "=========================================="

    # --------------------------------------------------------
    # Get changed files from current commit
    # --------------------------------------------------------

    - |
      curl --fail \
        --silent \
        --show-error \
        --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/repository/commits/${CI_COMMIT_SHA}/diff" \
        -o diff.json

    # --------------------------------------------------------
    # Show changed files
    # --------------------------------------------------------

    - |
      echo "Changed files:"

      jq -r '
        .[] |
        (.new_path // .old_path)
      ' diff.json || true

    # --------------------------------------------------------
    # Detect changed services
    # --------------------------------------------------------

    - |
      jq -r '
        .[] |
        (.new_path // .old_path) |
        select(startswith("src/")) |
        split("/")[1]
      ' diff.json |
      sort -u |
      grep -E '^(adservice|cartservice|checkoutservice|currencyservice|emailservice|frontend|loadgenerator|paymentservice|productcatalogservice|recommendationservice|shippingservice|shoppingassistantservice)$' \
      > changed-services.txt || true

    - |
      echo "=========================================="
      echo "Changed services:"
      cat changed-services.txt || true
      echo "=========================================="

    - |
      if [ ! -s changed-services.txt ]; then
        echo "No service changes detected."
        exit 0
      fi

    # --------------------------------------------------------
    # Prepare action files
    # --------------------------------------------------------

    - mkdir -p actions

    - |
      while IFS= read -r service
      do
        echo "Updating manifest for: ${service}"

        FILE_PATH="k8s/services/${service}/deployment.yaml"

        ENCODED_FILE_PATH=$(printf '%s' "${FILE_PATH}" | sed 's|/|%2F|g')

        # Get current deployment.yaml from the exact triggering commit
        curl --fail \
          --silent \
          --show-error \
          --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/repository/files/${ENCODED_FILE_PATH}?ref=${CI_COMMIT_SHA}" \
          -o response.json

        jq -r '.content' response.json |
          base64 -d > deployment.yaml

        # Replace only the image tag
        sed -E -i \
          "s|(image:[[:space:]]*${NEXUS_REGISTRY//./\\.}/${IMAGE_NAMESPACE}/${service}:)[^[:space:]]+|\\1${CI_COMMIT_SHA}|" \
          deployment.yaml

        CONTENT=$(cat deployment.yaml)

        jq -n \
          --arg file_path "${FILE_PATH}" \
          --arg content "${CONTENT}" \
          '{
            action: "update",
            file_path: $file_path,
            content: $content
          }' > "actions/${service}.json"

      done < changed-services.txt

    # --------------------------------------------------------
    # Create one GitLab commit
    # --------------------------------------------------------

    - |
      ACTIONS=$(jq -s '.' actions/*.json)

      jq -n \
        --arg branch "main" \
        --arg commit_message "ci: update changed service images to ${CI_COMMIT_SHA} [skip ci]" \
        --argjson actions "${ACTIONS}" \
        '{
          branch: $branch,
          commit_message: $commit_message,
          actions: $actions
        }' > commit.json

    # --------------------------------------------------------
    # Commit manifests
    # --------------------------------------------------------

    - |
      curl --fail \
        --silent \
        --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data-binary @commit.json \
        "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/repository/commits"

    - |
      echo "=========================================="
      echo "Manifest update completed successfully."
      echo "=========================================="