stages:
  - build
  - push


variables:
  IMAGE_BASE: "$NEXUS_REGISTRY/online-boutique"


.build_template:
  stage: build

  image: docker:27-cli

  script:
    - docker --version
    - docker info
    - docker build
        -f "src/$SERVICE/Dockerfile"
        -t "$IMAGE_BASE/$SERVICE:$CI_COMMIT_SHA"
        "src/$SERVICE"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "src/$SERVICE/**/*"


.push_template:
  stage: push

  image: docker:27-cli

  script:
    - echo "$NEXUS_PASSWORD" | docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" --password-stdin
    - docker push "$IMAGE_BASE/$SERVICE:$CI_COMMIT_SHA"
    - echo "Pushed $IMAGE_BASE/$SERVICE:$CI_COMMIT_SHA"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "src/$SERVICE/**/*"


build:
  extends: .build_template

  parallel:
    matrix:
      - SERVICE:
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice


push:
  extends: .push_template

  parallel:
    matrix:
      - SERVICE:
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice

  needs:
    - job: build
      parallel:
        matrix:
          - SERVICE: ['$SERVICE']
