stages:
  - build
  - push
  - update-manifests

variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"


.build-template:
  stage: build
  image: docker:27-cli

  script:
    - docker version

    - docker build
        --add-host=nexuss.mahbod.com:192.168.168.144
        --build-arg GOPROXY="$GOPROXY"
        -t "$NEXUS_REGISTRY/online-boutique/$SERVICE_NAME:$CI_COMMIT_SHA"
        "src/$SERVICE_NAME"

    - docker save
        "$NEXUS_REGISTRY/online-boutique/$SERVICE_NAME:$CI_COMMIT_SHA"
        -o "$SERVICE_NAME.tar"

  artifacts:
    paths:
      - "$SERVICE_NAME.tar"
    expire_in: 1 hour


.push-template:
  stage: push
  image: docker:27-cli

  script:
    - docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" -p "$NEXUS_PASSWORD"

    - docker load -i "$SERVICE_NAME.tar"

    - docker push "$NEXUS_REGISTRY/online-boutique/$SERVICE_NAME:$CI_COMMIT_SHA"


adservice-build:
  extends: .build-template
  variables:
    SERVICE_NAME: "adservice"

adservice-push:
  extends: .push-template
  needs:
    - adservice-build
  variables:
    SERVICE_NAME: "adservice"


