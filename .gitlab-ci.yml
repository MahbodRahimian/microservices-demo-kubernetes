stages:
  - build
  - push
  - update-manifest


variables:
  NEXUS_IMAGE_BASE: "$NEXUS_REGISTRY/online-boutique"


workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'


.build_template:
  stage: build

  image: docker:27-cli

  script:
    - docker --version
    - docker info
    - docker build -f "$DOCKERFILE" -t "$IMAGE_NAME:$CI_COMMIT_SHA" "$BUILD_CONTEXT"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'


.push_template:
  stage: push

  image: docker:27-cli

  script:
    - echo "$NEXUS_PASSWORD" | docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" --password-stdin
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHA"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


.update_manifest_template:
  stage: update-manifest

  image: alpine:3.20

  before_script:
    - apk add --no-cache curl jq

  script:
    - echo "Updating GitOps manifest for $SERVICE_NAME"
    - echo "Image: $IMAGE_NAME:$CI_COMMIT_SHA"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


adservice-build:
  extends: .build_template
  variables:
    SERVICE_NAME: "adservice"
    DOCKERFILE: "src/adservice/Dockerfile"
    BUILD_CONTEXT: "src/adservice"
    IMAGE_NAME: "$NEXUS_IMAGE_BASE/adservice"


adservice-push:
  extends: .push_template
  needs:
    - adservice-build
  variables:
    SERVICE_NAME: "adservice"
    IMAGE_NAME: "$NEXUS_IMAGE_BASE/adservice"


adservice-update-manifest:
  extends: .update_manifest_template
  needs:
    - adservice-push
  variables:
    SERVICE_NAME: "adservice"
    IMAGE_NAME: "$NEXUS_IMAGE_BASE/adservice"
    MANIFEST_FILE: "k8s/services/adservice/deployment.yaml"