stages:
  - build

shippingservice-build:
  stage: build

  image: docker:27-cli

  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

  script:
    - docker version
    - docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" -p "$NEXUS_PASSWORD"
    - docker build -t "$NEXUS_REGISTRY/online-boutique/shippingservice:$CI_COMMIT_SHA" src/shippingservice
    - docker push "$NEXUS_REGISTRY/online-boutique/shippingservice:$CI_COMMIT_SHA"