stages:
  - build

variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"

.build-template:
  stage: build
  image: docker:27-cli

  script:
    - docker version
    - docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" -p "$NEXUS_PASSWORD"
    - docker build --add-host=nexuss.mahbod.com:192.168.168.144 --build-arg GOPROXY="$GOPROXY" -t "$NEXUS_REGISTRY/online-boutique/$SERVICE_NAME:$CI_COMMIT_SHA" "src/$SERVICE_NAME"
    - docker push "$NEXUS_REGISTRY/online-boutique/$SERVICE_NAME:$CI_COMMIT_SHA"

adservice-build:
  extends: .build-template
  variables:
    SERVICE_NAME: "adservice"

cartservice-build:
  extends: .build-template
  variables:
    SERVICE_NAME: "cartservice"

