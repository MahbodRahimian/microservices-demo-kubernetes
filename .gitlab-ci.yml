stages:
  - test

shippingservice-build:
  stage: test

  image: golang:1.23.2-alpine

  variables:
    GOSUMDB: "off"

  before_script:
    - apk add --no-cache git

  script:
    - cd src/shippingservice
    - go version
    - go env GOPROXY
    - go mod download -x
    - go build -o shippingservice .