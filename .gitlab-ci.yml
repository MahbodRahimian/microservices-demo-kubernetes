stages:
  - build

shippingservice-build:
  stage: build

  image: docker:27-cli

  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

  script:
    - docker version
    - docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" -p "$NEXUS_PASSWORD"
    - docker build --add-host=nexuss.mahbod.com:192.168.168.144 --build-arg GOPROXY="$GOPROXY" -t "$NEXUS_REGISTRY/online-boutique/shippingservice:$CI_COMMIT_SHA" src/shippingservice
    - docker push "$NEXUS_REGISTRY/online-boutique/shippingservice:$CI_COMMIT_SHA"