apiVersion: apps/v1
kind: Deployment

metadata:
  name: adservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: adservice

  template:
    metadata:
      labels:
        app: adservice

    spec:
      containers:
        - name: adservice
          image: nexuss.mahbod.com:8082/online-boutique/adservice:5fac4d02ac631787e2f5178b78c5337b7119023e
          ports:
            - name: grpc
              containerPort: 9555