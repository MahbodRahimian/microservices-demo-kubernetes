apiVersion: apps/v1
kind: Deployment

metadata:
  name: adservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: adservice

  template:
    metadata:
      labels:
        app: adservice

    spec:
      containers:
        - name: adservice
          image: nexuss.mahbod.com:8082/online-boutique/adservice:8ef3dfb1c56abf149274618cae5b9ea7dc75efb2
          ports:
            - name: grpc
              containerPort: 9555