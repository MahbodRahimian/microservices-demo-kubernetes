apiVersion: apps/v1
kind: Deployment

metadata:
  name: adservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: adservice

  template:
    metadata:
      labels:
        app: adservice

    spec:
      containers:
        - name: adservice
          image: nexuss.mahbod.com:8082/online-boutique/adservice:b732e712482ba5a11a2b14e6e4570c8f95798c68
          ports:
            - name: grpc
              containerPort: 9555