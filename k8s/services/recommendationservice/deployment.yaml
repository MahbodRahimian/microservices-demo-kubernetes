apiVersion: apps/v1
kind: Deployment

metadata:
  name: recommendationservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: recommendationservice

  template:
    metadata:
      labels:
        app: recommendationservice

    spec:
      containers:
        - name: recommendationservice
          image: nexuss.mahbod.com:8082/online-boutique/recommendationservice:b732e712482ba5a11a2b14e6e4570c8f95798c68

          ports:
            - name: grpc
              containerPort: 8080

          env:
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"