apiVersion: apps/v1
kind: Deployment

metadata:
  name: currencyservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: currencyservice

  template:
    metadata:
      labels:
        app: currencyservice

    spec:
      containers:
        - name: currencyservice
          image: nexuss.mahbod.com:8082/online-boutique/currencyservice:5fac4d02ac631787e2f5178b78c5337b7119023e

          ports:
            - name: grpc
              containerPort: 7000