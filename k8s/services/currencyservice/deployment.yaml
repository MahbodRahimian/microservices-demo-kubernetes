apiVersion: apps/v1
kind: Deployment

metadata:
  name: currencyservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: currencyservice

  template:
    metadata:
      labels:
        app: currencyservice

    spec:
      containers:
        - name: currencyservice
          image: nexuss.mahbod.com:8082/online-boutique/currencyservice:b732e712482ba5a11a2b14e6e4570c8f95798c68

          ports:
            - name: grpc
              containerPort: 7000

          env:
            - name: PORT
              value: "7000"

            - name: DISABLE_PROFILER
              value: "1"