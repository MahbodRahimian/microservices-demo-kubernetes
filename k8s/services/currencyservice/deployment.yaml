apiVersion: apps/v1
kind: Deployment

metadata:
  name: currencyservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: currencyservice

  template:
    metadata:
      labels:
        app: currencyservice

    spec:
      containers:
        - name: currencyservice
          image: nexuss.mahbod.com:8082/online-boutique/currencyservice:8ef3dfb1c56abf149274618cae5b9ea7dc75efb2

          ports:
            - name: grpc
              containerPort: 7000