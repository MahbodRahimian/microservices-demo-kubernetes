apiVersion: apps/v1
kind: Deployment

metadata:
  name: productcatalogservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: productcatalogservice

  template:
    metadata:
      labels:
        app: productcatalogservice

    spec:
      containers:
        - name: productcatalogservice
          image: nexuss.mahbod.com:8082/online-boutique/productcatalogservice:b732e712482ba5a11a2b14e6e4570c8f95798c68

          ports:
            - name: grpc
              containerPort: 3550