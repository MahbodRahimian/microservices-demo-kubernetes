apiVersion: apps/v1
kind: Deployment

metadata:
  name: productcatalogservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: productcatalogservice

  template:
    metadata:
      labels:
        app: productcatalogservice

    spec:
      containers:
        - name: productcatalogservice
          image: nexuss.mahbod.com:8082/online-boutique/productcatalogservice:5fac4d02ac631787e2f5178b78c5337b7119023e

          ports:
            - name: grpc
              containerPort: 3550