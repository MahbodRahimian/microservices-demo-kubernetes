apiVersion: apps/v1
kind: Deployment

metadata:
  name: productcatalogservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: productcatalogservice

  template:
    metadata:
      labels:
        app: productcatalogservice

    spec:
      containers:
        - name: productcatalogservice
          image: nexuss.mahbod.com:8082/online-boutique/productcatalogservice:caa8cc439f895ed88a3b30bf7ed899516e0ae3db

          ports:
            - name: grpc
              containerPort: 3550