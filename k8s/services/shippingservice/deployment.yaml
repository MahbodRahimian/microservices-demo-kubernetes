apiVersion: apps/v1
kind: Deployment

metadata:
  name: shippingservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: shippingservice

  template:
    metadata:
      labels:
        app: shippingservice

    spec:
      containers:
        - name: shippingservice
          image: nexuss.mahbod.com:8082/online-boutique/shippingservice:caa8cc439f895ed88a3b30bf7ed899516e0ae3db

          ports:
            - name: grpc
              containerPort: 50051