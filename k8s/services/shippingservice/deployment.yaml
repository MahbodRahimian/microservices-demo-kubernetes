apiVersion: apps/v1
kind: Deployment

metadata:
  name: shippingservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: shippingservice

  template:
    metadata:
      labels:
        app: shippingservice

    spec:
      containers:
        - name: shippingservice
          image: nexuss.mahbod.com:8082/online-boutique/shippingservice:8ef3dfb1c56abf149274618cae5b9ea7dc75efb2

          ports:
            - name: grpc
              containerPort: 50051