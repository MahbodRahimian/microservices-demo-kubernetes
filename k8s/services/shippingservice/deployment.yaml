apiVersion: apps/v1
kind: Deployment

metadata:
  name: shippingservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: shippingservice

  template:
    metadata:
      labels:
        app: shippingservice

    spec:
      containers:
        - name: shippingservice
          image: nexuss.mahbod.com:8082/online-boutique/shippingservice:b732e712482ba5a11a2b14e6e4570c8f95798c68

          ports:
            - name: grpc
              containerPort: 50051