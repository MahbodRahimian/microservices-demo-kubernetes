apiVersion: apps/v1
kind: Deployment

metadata:
  name: loadgenerator
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: loadgenerator

  template:
    metadata:
      labels:
        app: loadgenerator

    spec:
      containers:
        - name: loadgenerator
          image: nexuss.mahbod.com:8082/online-boutique/loadgenerator:5fac4d02ac631787e2f5178b78c5337b7119023e

          env:
            - name: FRONTEND_ADDR
              value: "frontend:80"

            - name: USERS
              value: "10"