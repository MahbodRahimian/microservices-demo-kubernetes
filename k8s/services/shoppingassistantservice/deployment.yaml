apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingassistantservice
  namespace: online-boutique
  labels:
    app: shoppingassistantservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shoppingassistantservice
  template:
    metadata:
      labels:
        app: shoppingassistantservice
    spec:
      containers:
        - name: shoppingassistantservice
          image: nexuss.mahbod.com:8082/online-boutique/shoppingassistantservice:e594f5c3a554fd83ec8c3e2a8f63302f635e2a70
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"