apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingassistantservice
  namespace: online-boutique
  labels:
    app: shoppingassistantservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shoppingassistantservice
  template:
    metadata:
      labels:
        app: shoppingassistantservice
    spec:
      containers:
        - name: shoppingassistantservice
          image: nexuss.mahbod.com:8082/online-boutique/shoppingassistantservice:0dff294e8d9f0cf3076d11c73e563363cab9e837
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"