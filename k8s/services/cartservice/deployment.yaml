apiVersion: apps/v1
kind: Deployment

metadata:
  name: cartservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cartservice

  template:
    metadata:
      labels:
        app: cartservice

    spec:
      containers:
        - name: cartservice
          image: nexuss.mahbod.com:8082/online-boutique/cartservice:caa8cc439f895ed88a3b30bf7ed899516e0ae3db

          ports:
            - name: grpc
              containerPort: 7070

          env:
            - name: REDIS_ADDR
              value: "redis-cart:6379"