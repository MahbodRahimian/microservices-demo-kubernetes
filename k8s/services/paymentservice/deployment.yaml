apiVersion: apps/v1
kind: Deployment

metadata:
  name: paymentservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: paymentservice

  template:
    metadata:
      labels:
        app: paymentservice

    spec:
      containers:
        - name: paymentservice
          image: nexuss.mahbod.com:8082/online-boutique/paymentservice:8ef3dfb1c56abf149274618cae5b9ea7dc75efb2

          ports:
            - name: grpc
              containerPort: 50051
          env:
            - name: PORT
              value: "50051"