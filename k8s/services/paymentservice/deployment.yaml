apiVersion: apps/v1
kind: Deployment

metadata:
  name: paymentservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: paymentservice

  template:
    metadata:
      labels:
        app: paymentservice

    spec:
      containers:
        - name: paymentservice
          image: nexuss.mahbod.com:8082/online-boutique/paymentservice:b732e712482ba5a11a2b14e6e4570c8f95798c68

          ports:
            - name: grpc
              containerPort: 50051

          env:
            - name: PORT
              value: "50051"

            - name: DISABLE_PROFILER
              value: "1"