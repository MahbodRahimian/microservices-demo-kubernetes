apiVersion: apps/v1
kind: Deployment

metadata:
  name: emailservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: emailservice

  template:
    metadata:
      labels:
        app: emailservice

    spec:
      containers:
        - name: emailservice
          image: nexuss.mahbod.com:8082/online-boutique/emailservice:b732e712482ba5a11a2b14e6e4570c8f95798c68

          ports:
            - name: grpc
              containerPort: 5000