apiVersion: apps/v1
kind: Deployment

metadata:
  name: emailservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: emailservice

  template:
    metadata:
      labels:
        app: emailservice

    spec:
      containers:
        - name: emailservice
          image: nexuss.mahbod.com:8082/online-boutique/emailservice:5fac4d02ac631787e2f5178b78c5337b7119023e

          ports:
            - name: grpc
              containerPort: 5000