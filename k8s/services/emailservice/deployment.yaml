apiVersion: apps/v1
kind: Deployment

metadata:
  name: emailservice
  namespace: online-boutique

spec:
  replicas: 1

  selector:
    matchLabels:
      app: emailservice

  template:
    metadata:
      labels:
        app: emailservice

    spec:
      containers:
        - name: emailservice
          image: nexuss.mahbod.com:8082/online-boutique/emailservice:caa8cc439f895ed88a3b30bf7ed899516e0ae3db

          ports:
            - name: grpc
              containerPort: 5000